<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>CS Quest — วิทยาการคำนวณ</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;touch-action:none}
:root{--bg:#0a0e14;--panel:rgba(8,16,8,0.97);--border:#1e3a1e;--green:#5dde3a;--gold:#ffd700;--red:#e53935;--text:#d4e8d4;--muted:#4a6a4a}
body{background:var(--bg);font-family:'Sarabun',sans-serif;color:var(--text)}
.screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:200}
.screen.off{display:none!important}

/* LOBBY */
#s-lobby{background:radial-gradient(ellipse at 50% -10%,#0d280d,#0a0e14 65%)}
.lb-wrap{display:flex;gap:1.4rem;width:840px;max-width:97vw;align-items:flex-start}
.lb-left{flex:0 0 310px}
.lb-right{flex:1;background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:14px;padding:1rem;min-height:260px}
.logo{font-size:1.8rem;font-weight:800;color:var(--green);text-shadow:0 0 24px rgba(93,222,58,.4);margin-bottom:.12rem}
.logo-sub{color:var(--muted);font-size:.8rem;margin-bottom:1rem}
.panel{background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:13px;padding:1rem 1.1rem;margin-bottom:.75rem}
.fl{color:var(--muted);font-size:.74rem;margin-bottom:.2rem;display:block}
input,select{width:100%;padding:.45rem .7rem;border-radius:7px;border:1px solid var(--border);background:rgba(255,255,255,.05);color:#fff;font-size:.88rem;font-family:'Sarabun',sans-serif;outline:none;transition:border-color .2s}
input:focus,select:focus{border-color:var(--green)}
select option{background:#0d1a0d}
.mb{margin-bottom:.55rem}
.av-row{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:.5rem}
.av-btn{width:42px;height:42px;border-radius:8px;border:2px solid transparent;background:rgba(255,255,255,.06);cursor:pointer;font-size:1.28rem;display:flex;align-items:center;justify-content:center;transition:all .14s}
.av-btn:hover{background:rgba(255,255,255,.12)}
.av-btn.on{border-color:var(--green);background:rgba(93,222,58,.12)}
/* avatar preview */
.av-preview{width:64px;height:80px;border-radius:10px;border:1px solid var(--border);background:rgba(255,255,255,.04);overflow:hidden;position:relative;float:right;margin-left:.5rem}
.av-preview canvas{image-rendering:pixelated;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(2.5)}
.lv-grid{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-bottom:.5rem;clear:both}
.lv-card{border-radius:8px;border:1px solid rgba(255,255,255,.07);padding:.45rem .6rem;cursor:pointer;transition:all .14s}
.lv-card.on{outline:2px solid var(--green)}
.lv-name{font-size:.72rem;font-weight:700;color:#fff}
.lv-sub{font-size:.66rem;color:rgba(255,255,255,.42);margin-top:1px}
.btn{width:100%;padding:.58rem;border-radius:8px;border:none;font-size:.92rem;font-weight:700;font-family:'Sarabun',sans-serif;cursor:pointer;transition:all .16s}
.btn-green{background:linear-gradient(135deg,var(--green),#3cb821);color:#0a0e14}
.btn-green:hover{transform:translateY(-2px);box-shadow:0 4px 18px rgba(93,222,58,.35)}
.btn-green:disabled{opacity:.4;cursor:default;transform:none}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--muted);font-size:.8rem;padding:.4rem;margin-top:.32rem}
.btn-outline:hover{border-color:var(--green);color:var(--green)}
.conn-row{display:flex;align-items:center;gap:4px;font-size:.68rem;color:var(--muted);margin-top:.4rem}
#cdot{width:7px;height:7px;border-radius:50%;background:var(--muted)}
#cdot.on{background:var(--green)}#cdot.wait{background:#ff9800}
.lb-right h3{color:var(--gold);font-size:.8rem;margin-bottom:.65rem;text-align:center}
#lobby-players{display:flex;flex-direction:column;gap:.32rem;min-height:90px}
.lp-row{display:flex;align-items:center;gap:.42rem;padding:.32rem .42rem;background:rgba(255,255,255,.04);border-radius:7px}
.lp-av-c{width:28px;height:36px;overflow:hidden;position:relative;flex-shrink:0}
.lp-av-c canvas{image-rendering:pixelated;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(1.5)}
.lp-name{font-size:.8rem;font-weight:600;flex:1}
.ready-yes{color:var(--green);font-size:.68rem}
.ready-no{color:var(--muted);font-size:.68rem}
.lobby-info{color:var(--muted);font-size:.72rem;text-align:center;margin-top:.65rem;line-height:1.5}
.admin-link{color:var(--muted);font-size:.66rem;text-decoration:none;display:inline-block;margin-top:.32rem}
.admin-link:hover{color:var(--green)}

/* HUD */
#hud{position:fixed;top:0;left:0;right:0;height:44px;background:rgba(6,12,6,.96);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 .75rem;gap:.55rem;z-index:100;backdrop-filter:blur(6px)}
.hs{width:1px;height:16px;background:rgba(255,255,255,.12)}
#hud-av{width:24px;height:30px;overflow:hidden;position:relative;flex-shrink:0}
#hud-av canvas{image-rendering:pixelated;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(1.2)}
#hud-name{color:var(--green);font-weight:700;font-size:.84rem;max-width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#hud-lv{color:var(--muted);font-size:.72rem}
#hud-wave{color:var(--gold);font-size:.76rem;font-weight:700}
#hud-sc{color:#fff;font-size:.86rem;font-weight:700}
#hud-prog{color:#aad;font-size:.7rem}
#hud-pl{color:var(--green);font-size:.7rem;margin-left:auto}
#hud-ms{color:#3a5a3a;font-size:.65rem}
#wbar-wrap{position:fixed;top:44px;left:0;right:0;height:5px;background:rgba(255,255,255,.04);z-index:100}
#wbar{height:100%;background:linear-gradient(90deg,var(--green),var(--gold));transition:width .4s}

/* LB */
#lb-hud{position:fixed;top:59px;right:6px;width:168px;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:.52rem;z-index:90}
#lb-hud h4{color:var(--gold);font-size:.7rem;text-align:center;margin-bottom:.38rem}
#lb-list{list-style:none;display:flex;flex-direction:column;gap:2px}
#lb-list li{display:flex;align-items:center;gap:4px;padding:2px 0;font-size:.67rem;color:#99b;border-bottom:1px solid rgba(255,255,255,.04)}
#lb-list li:last-child{border:none}
.lbr{width:13px;text-align:center;font-size:.62rem;color:#556}
.lbr.g{color:var(--gold)}.lbr.s{color:#c0c0c0}.lbr.b{color:#cd7f32}
.lbn{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lbs{color:var(--gold);font-weight:700;font-size:.68rem}
.lb-me{color:var(--green)!important;font-weight:700}

/* DIALOG */
#dialog{position:fixed;bottom:0;left:0;right:0;background:rgba(6,12,6,.98);border-top:2px solid var(--border);padding:.75rem .95rem;z-index:150;transform:translateY(100%);transition:transform .22s ease;max-height:58vh;overflow-y:auto}
#dialog.show{transform:translateY(0)}
#dlg-npc{color:var(--green);font-weight:700;font-size:.86rem;margin-bottom:.2rem}
#dlg-sub{color:var(--muted);font-size:.74rem;margin-bottom:.5rem}
#quiz-area{display:none}
#quiz-q{color:#fff;font-size:.88rem;font-weight:700;margin-bottom:.5rem;line-height:1.5}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:.35rem}
.ob{padding:.46rem .62rem;border-radius:8px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.04);color:var(--text);font-family:'Sarabun',sans-serif;font-size:.78rem;cursor:pointer;text-align:left;line-height:1.4;transition:all .12s}
.ob:hover:not(:disabled){background:rgba(93,222,58,.1);border-color:var(--green)}
.ob.ok{background:rgba(76,175,80,.2);border-color:#4caf50;color:#a5d6a7}
.ob.no{background:rgba(229,57,53,.2);border-color:#e53935;color:#ef9a9a}
.ob.show-ans{background:rgba(76,175,80,.12);border-color:#4caf50}
#quiz-exp{color:#6a9a6a;font-size:.74rem;margin-top:.4rem;display:none;line-height:1.5}
#quiz-pop{font-weight:700;font-size:.9rem;display:none;margin-top:.35rem}
.pop-ok{color:var(--gold)}.pop-no{color:var(--red)}
#dlg-close{padding:.36rem 1rem;border-radius:7px;border:1px solid var(--border);background:transparent;color:var(--muted);font-family:'Sarabun',sans-serif;cursor:pointer;font-size:.78rem;margin-top:.36rem;display:none}
#dlg-close:hover{border-color:var(--green);color:var(--green)}

/* WAVE CLEAR */
#wave-clear{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(0);background:rgba(6,12,6,.98);border:2px solid var(--green);border-radius:16px;padding:1.4rem 2rem;text-align:center;z-index:180;transition:transform .3s cubic-bezier(.34,1.56,.64,1);min-width:265px}
#wave-clear.show{transform:translate(-50%,-50%) scale(1)}
.wc-icon{font-size:2.5rem;margin-bottom:.22rem}
.wc-title{color:var(--green);font-size:1.35rem;font-weight:800;margin-bottom:.16rem}
.wc-sub{color:var(--muted);font-size:.8rem;margin-bottom:.32rem}
.wc-score{color:var(--gold);font-size:1.9rem;font-weight:800;margin-bottom:.85rem}
.wc-btns{display:flex;gap:.45rem;justify-content:center}
.wc-btn{padding:.47rem 1.4rem;border-radius:8px;border:none;background:var(--green);color:#0a0e14;font-weight:800;font-family:'Sarabun',sans-serif;cursor:pointer;font-size:.88rem;transition:all .13s}
.wc-btn:hover{background:#3cb821;transform:translateY(-1px)}
.wc-btn-end{background:rgba(255,255,255,.08);color:var(--text);border:1px solid var(--border)}
.wc-btn-end:hover{background:rgba(255,255,255,.15);transform:translateY(-1px)}

/* RESULTS */
#s-results{background:rgba(6,12,6,.97)}
.res-box{width:560px;max-width:96vw;text-align:center}
.res-title{font-size:1.85rem;font-weight:800;color:var(--gold);margin-bottom:.22rem;text-shadow:0 0 20px rgba(255,215,0,.4)}
.res-sub{color:var(--muted);margin-bottom:1.2rem;font-size:.85rem}
.res-table{width:100%;border-collapse:collapse;margin-bottom:1rem}
.res-table th{color:var(--muted);font-size:.7rem;font-weight:600;padding:.35rem;border-bottom:1px solid var(--border);text-align:left}
.res-table td{padding:.4rem .35rem;font-size:.84rem;border-bottom:1px solid rgba(255,255,255,.04);vertical-align:middle}
.res-table tr:last-child td{border:none}
.rank-1{color:var(--gold);font-weight:800;font-size:.98rem}
.rank-2{color:#c0c0c0;font-weight:700}
.rank-3{color:#cd7f32;font-weight:700}
.res-self{background:rgba(93,222,58,.08)!important}
.res-self td{color:var(--green)!important}
.res-btn-row{display:flex;gap:.5rem;justify-content:center}
.btn-sm{padding:.46rem 1.25rem;border-radius:8px;font-size:.84rem}
.res-av{width:24px;height:32px;overflow:hidden;position:relative;display:inline-block;vertical-align:middle}
.res-av canvas{image-rendering:pixelated;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(1.4)}

/* CHAT */
#chat-wrap{position:fixed;bottom:0;left:6px;width:225px;z-index:90}
#chat-log{background:rgba(0,0,0,.38);border-radius:8px 8px 0 0;padding:.3rem;max-height:82px;overflow-y:auto;display:flex;flex-direction:column;gap:2px}
.cm{font-size:.64rem;color:#8a9a8a;line-height:1.3}
.cm .cn{color:var(--green);font-weight:700}
.cm.sys{color:#4a7a4a;font-style:italic}
#chat-row{display:flex}
#ci{flex:1;background:rgba(0,0,0,.5);border:1px solid var(--border);border-radius:0 0 0 8px;color:#fff;font-family:'Sarabun',sans-serif;font-size:.68rem;padding:.25rem .4rem;outline:none}
#cs{padding:.25rem .48rem;background:var(--border);border:none;color:var(--green);border-radius:0 0 8px 0;cursor:pointer;font-size:.66rem}
#mm{position:fixed;bottom:6px;right:6px;z-index:90;border-radius:7px;border:1px solid var(--border);image-rendering:pixelated}
#ctrl-hint{position:fixed;top:59px;left:6px;color:rgba(255,255,255,.2);font-size:.61rem;line-height:1.8;z-index:90;pointer-events:none}
#map-badge{position:fixed;top:59px;left:50%;transform:translateX(-50%);background:var(--panel);border:1px solid var(--border);border-radius:20px;padding:.2rem .85rem;font-size:.7rem;color:var(--gold);z-index:90;transition:opacity 1.2s}
#map-badge.fade{opacity:0}
#joy-wrap{display:none;position:fixed;bottom:65px;left:14px;z-index:90}
@media(max-width:768px){#joy-wrap{display:block}}
#joy-base{width:80px;height:80px;border-radius:50%;background:rgba(93,222,58,.06);border:1.5px solid rgba(93,222,58,.22);position:relative}
#joy-knob{width:34px;height:34px;border-radius:50%;background:rgba(93,222,58,.22);position:absolute;top:50%;left:50%;transform:translate(-50%,-50%)}
canvas{display:block;image-rendering:pixelated;image-rendering:crisp-edges}
#gc{position:absolute;top:0;left:0}
</style>
</head>
<body>
<!-- LOBBY -->
<div id="s-lobby" class="screen">
  <div class="lb-wrap">
    <div class="lb-left">
      <div class="logo">⚔️ CS Quest</div>
      <div class="logo-sub">วิทยาการคำนวณ ม.1 — Pixel RPG Multiplayer</div>
      <div class="panel">
        <label class="fl">ชื่อผู้เล่น</label>
        <input id="inp-name" class="mb" type="text" maxlength="16" placeholder="กรอกชื่อ..."/>
        <label class="fl">เลือกตัวละคร</label>
        <div class="av-preview"><canvas id="av-preview-c" width="24" height="36"></canvas></div>
        <div class="av-row" id="av-row"></div>
        <label class="fl">เลือกด่านการเรียนรู้</label>
        <div class="lv-grid" id="lv-grid"></div>
        <label class="fl" style="margin-bottom:.2rem">รหัสห้อง</label>
        <input id="inp-room" class="mb" type="text" maxlength="12" placeholder="เช่น m1-101"/>
        <button class="btn btn-green mb" id="btn-join">เข้าห้องรอ 🚪</button>
        <div class="conn-row"><span id="cdot"></span><span id="ctxt">กำลังเชื่อมต่อ...</span></div>
        <div style="text-align:center"><a class="admin-link" href="/admin.html">⚙️ จัดการคำถาม</a></div>
      </div>
    </div>
    <div class="lb-right">
      <h3>🏠 ห้องรอ</h3>
      <div id="lobby-players"><div style="color:var(--muted);font-size:.76rem;text-align:center;padding:.75rem">เข้าห้องก่อนเพื่อดูผู้เล่น</div></div>
      <div class="lobby-info" id="lobby-info">กรอกชื่อและกด "เข้าห้องรอ"</div>
      <div style="margin-top:.65rem;display:flex;flex-direction:column;gap:.32rem">
        <button class="btn btn-green" id="btn-ready" style="display:none">✅ พร้อมแล้ว!</button>
        <button class="btn btn-outline" id="btn-start-now" style="display:none">▶ เริ่มเลย (ครู)</button>
      </div>
    </div>
  </div>
</div>

<!-- GAME -->
<div id="s-game" class="screen off" style="align-items:flex-start;justify-content:flex-start;padding:0">
  <div style="position:relative;width:100vw;height:100vh">
    <canvas id="gc"></canvas>
    <div id="hud">
      <div id="hud-av"><canvas width="24" height="36" id="hud-av-c"></canvas></div>
      <span id="hud-name"></span><div class="hs"></div>
      <span id="hud-lv"></span><div class="hs"></div>
      <span id="hud-wave"></span><div class="hs"></div>
      <span>⭐</span><span id="hud-sc">0</span><div class="hs"></div>
      <span id="hud-prog" style="color:#aad">0/0</span>
      <span id="hud-pl" style="margin-left:auto">👥 1</span>
      <div class="hs"></div><span id="hud-ms">—ms</span>
    </div>
    <div id="wbar-wrap"><div id="wbar" style="width:0%"></div></div>
    <div id="map-badge"></div>
    <div id="lb-hud"><h4>🏆 อันดับ</h4><ul id="lb-list"></ul></div>
    <div id="ctrl-hint">WASD/ลูกศร=เดิน<br>Space/E=คุย NPC</div>
    <div id="dialog">
      <div id="dlg-npc"></div><div id="dlg-sub"></div>
      <div id="quiz-area">
        <div id="quiz-q"></div>
        <div class="opts" id="qopts"></div>
        <div id="quiz-exp"></div><div id="quiz-pop"></div>
      </div>
      <button id="dlg-close" onclick="closeDialog()">ปิด ✕</button>
    </div>
    <div id="chat-wrap">
      <div id="chat-log"></div>
      <div id="chat-row"><input id="ci" type="text" maxlength="60" placeholder="ข้อความ..."/><button id="cs">ส่ง</button></div>
    </div>
    <canvas id="mm" width="112" height="80"></canvas>
    <div id="wave-clear">
      <div class="wc-icon" id="wc-icon">🎉</div>
      <div class="wc-title" id="wc-title"></div>
      <div class="wc-sub" id="wc-sub"></div>
      <div class="wc-score" id="wc-score"></div>
      <div class="wc-btns">
        <button class="wc-btn" id="wc-next">Wave ต่อไป →</button>
        <button class="wc-btn wc-btn-end" id="wc-end">🏆 จบ &amp; ดูผล</button>
      </div>
    </div>
    <div id="joy-wrap"><div id="joy-base"><div id="joy-knob"></div></div></div>
  </div>
</div>

<!-- RESULTS -->
<div id="s-results" class="screen off">
  <div class="res-box">
    <div class="res-title">🏆 สรุปผลคะแนน</div>
    <div class="res-sub" id="res-sub"></div>
    <table class="res-table">
      <thead><tr><th width="40">อันดับ</th><th width="36">ตัวละคร</th><th>ชื่อ</th><th style="text-align:right" width="65">คะแนน</th><th style="text-align:right" width="55">Wave</th></tr></thead>
      <tbody id="res-tbody"></tbody>
    </table>
    <div class="res-btn-row">
      <button class="btn btn-green btn-sm" onclick="goLobby()">🔄 เล่นใหม่</button>
    </div>
  </div>
</div>

<script src="questions.js"></script>
<script src="sprites.js"></script>
<script>
// ══════ CONFIG ══════
const WS_URL=(()=>{
  const h=window.location.hostname,p=window.location.protocol==='https:'?'wss:':'ws:',pt=window.location.port;
  return(h==='localhost'||h==='127.0.0.1')?`ws://${h}:${pt||3000}`:`${p}//${h}${pt?':'+pt:''}`;
})();

const TILE=32, TW=28, TH=21;
const CW=TW*TILE, CH=TH*TILE;
const AVATARS=['🧑','👧','🧒','👮','🧙','👩‍🎓'];
const INTERACT=68, MOVE_MS=50, QS_PER_WAVE=5;

const MAP_THEMES={
  school:{name:'🏫 โรงเรียน', npcIdx:0},
  forest:{name:'🌲 ป่า',       npcIdx:0},
  town:  {name:'🏘️ ชุมชน',     npcIdx:0},
  stadium:{name:'🏟️ สนามกีฬา', npcIdx:0},
};
const THEME_KEYS=['school','forest','town','stadium'];

// ══════ STATE ══════
let ws=null,selfId=null,players={},myScore=0;
let selLv=1,selAv=0,dialogOpen=false;
let answeredNPCs=new Set();
let waveNum=1,wavePool=[],waveAnswered=0,waveCorrect=0;
let mapTheme='school',camX=0,camY=0;
let pingT=0,pingMs=0,lastSent=0,animF=0;
let mapTiles=[],npcDefs=[];
let isHost=false;
const keys={},bubbles={};
let me={id:null,name:'',avatar:0,x:CW/2,y:CH/2,score:0,wave:1,direction:'down',moving:false};
let rafId=null, lastT=0;

// ══════ LOBBY ══════
function buildLobby(){
  updateAvPreview(0);
  const ar=document.getElementById('av-row'); ar.innerHTML='';
  AVATARS.forEach((a,i)=>{
    const b=document.createElement('button'); b.className='av-btn'+(i===0?' on':''); b.textContent=a; b.dataset.i=i;
    b.onclick=()=>{ document.querySelectorAll('.av-btn').forEach(x=>x.classList.remove('on')); b.classList.add('on'); selAv=i; updateAvPreview(i); };
    ar.appendChild(b);
  });
  const lg=document.getElementById('lv-grid'); lg.innerHTML='';
  Object.entries(QUESTIONS).forEach(([id,lv],idx)=>{
    const d=document.createElement('div'); d.className='lv-card'+(idx===0?' on':'');
    d.style.cssText=`background:linear-gradient(135deg,${lv.color}18,${lv.color}28);border-color:${lv.color}44`;
    d.innerHTML=`<div class="lv-name" style="color:${lv.color}">${lv.npcEmoji} ${lv.name}</div><div class="lv-sub">${lv.questions.length} คำถาม</div>`;

// ══════ WEBSOCKET ══════
function connectWS(){
  try{
    ws=new WebSocket(WS_URL);
    const dot=document.getElementById('cdot'),txt=document.getElementById('ctxt');
    dot.className='wait'; txt.textContent='กำลังเชื่อมต่อ...';
    ws.onopen=()=>{dot.className='on';txt.textContent='เชื่อมต่อสำเร็จ ✓';};
    ws.onmessage=e=>handleMsg(JSON.parse(e.data));
    ws.onclose=()=>{dot.className='';txt.textContent='ขาดการเชื่อมต่อ';addChat('⚠ ขาดการเชื่อมต่อ','sys');};
    ws.onerror=()=>{dot.className='';txt.textContent='เชื่อมต่อไม่ได้';};
  }catch(e){}
}
function wsSend(t,p){if(ws&&ws.readyState===1)ws.send(JSON.stringify({type:t,payload:p}));}

function handleMsg(msg){
  const{type:t,payload:p}=msg;
  if(t==='INIT'){selfId=p.selfId;me.id=selfId;p.players.forEach(x=>{if(x.id!==selfId)players[x.id]=x;});isHost=(p.players[0]?.id===selfId||p.players.length===1);updateLobbyPanel(p);updateLB(p.leaderboard);}
  else if(t==='LOBBY_UPDATE'){p.players.forEach(x=>{if(x.id!==selfId)players[x.id]={...players[x.id],...x};});updateLobbyPanel(p);}
  else if(t==='PLAYER_JOINED'){if(p.id!==selfId)players[p.id]=p;updatePCount();}
  else if(t==='PLAYER_LEFT'){delete players[p.id];addChat(`${p.name} ออกจากเกม`,'sys');updatePCount();}
  else if(t==='GAME_START'){startGame(p.wave||1);}
  else if(t==='PLAYER_MOVED'){if(p.id!==selfId&&players[p.id]){const q=players[p.id];q.x=p.x;q.y=p.y;q.direction=p.direction;q.moving=p.moving;}}
  else if(t==='SCORE_UPDATE'){myScore=p.score;me.score=myScore;document.getElementById('hud-sc').textContent=myScore;}
  else if(t==='LEADERBOARD'){updateLB(p.leaderboard);}
  else if(t==='CHAT_MSG'){addChat(p.text,'user',p.name,p.id===selfId);showBubble(p.id,p.text);}
  else if(t==='SHOW_RESULTS'){doShowResults(p.leaderboard);}
  else if(t==='PONG'){pingMs=Date.now()-pingT;document.getElementById('hud-ms').textContent=pingMs+'ms';}
}

function updateLobbyPanel(snap){
  const con=document.getElementById('lobby-players'); con.innerHTML='';
  const all=snap.players||[];
  if(!all.length){con.innerHTML='<div style="color:var(--muted);font-size:.76rem;text-align:center;padding:.75rem">ยังไม่มีผู้เล่น...</div>';return;}
  all.forEach((p,i)=>{
    const div=document.createElement('div'); div.className='lp-row';
    const isSelf=p.id===selfId;
    const avC=document.createElement('canvas'); avC.width=24; avC.height=36;
    const avCtx=avC.getContext('2d'); avCtx.drawImage(SPR.getPlayer(p.avatar||0,'down',0,false),0,0);
    const avWrap=document.createElement('div'); avWrap.className='lp-av-c'; avWrap.appendChild(avC);
    div.appendChild(avWrap);
    div.innerHTML+=`<span class="lp-name" style="${isSelf?'color:var(--green)':''}">${p.name}${i===0?' 👑':''}</span><span class="${p.ready?'ready-yes':'ready-no'}">${p.ready?'✅ พร้อม':'⏳ รอ...'}</span>`;
    con.appendChild(div);
  });

  document.getElementById('lobby-info').textContent=`ผู้เล่น ${all.length} คน · พร้อม ${rdy}/${all.length}`;

  if(isHost||all.length===1)document.getElementById('btn-start-now').style.display='block';
}

// ══════ MAP GENERATION ══════
function seededRnd(s){let x=s|0;return()=>{x=(x*1664525+1013904223)&0x7fffffff;return x/0x7fffffff;};}

function generateMap(lvl,wave){
  mapTheme=THEME_KEYS[(wave-1)%4];
  const rnd=seededRnd(lvl*999+wave*137);
  mapTiles=[];
  for(let y=0;y<TH;y++){mapTiles[y]=[];for(let x=0;x<TW;x++)mapTiles[y][x]=0;}
  for(let x=0;x<TW;x++){mapTiles[0][x]=3;mapTiles[TH-1][x]=3;}
  for(let y=0;y<TH;y++){mapTiles[y][0]=3;mapTiles[y][TW-1]=3;}
  const cx=TW>>1,cy=TH>>1;
  for(let x=1;x<TW-1;x++){mapTiles[cy][x]=1;mapTiles[cy+1][x]=1;}
  for(let y=1;y<TH-1;y++){mapTiles[y][cx]=1;mapTiles[y][cx+1]=1;}
  for(let x=2;x<TW-2;x++){mapTiles[2][x]=1;mapTiles[TH-3][x]=1;}
  for(let y=2;y<TH-2;y++){mapTiles[y][2]=1;mapTiles[y][TW-3]=1;}
  [[cx/2|0,2,cx/2|0,cy],[cx+cx/2|0,cy,cx+cx/2|0,TH-3],[2,cy/2|0,cx,cy/2|0],[cx,cy+cy/2|0,TW-3,cy+cy/2|0]].forEach(([x1,y1,x2,y2])=>{
    for(let y=Math.min(y1,y2);y<=Math.max(y1,y2);y++)for(let x=Math.min(x1,x2);x<=Math.max(x1,x2);x++)if(mapTiles[y]&&mapTiles[y][x]===0)mapTiles[y][x]=1;
  });
  for(let p=0;p<2;p++){
    const wx=3+Math.floor(rnd()*(TW-10)),wy=3+Math.floor(rnd()*(TH-10));
    for(let y=wy;y<wy+2&&y<TH-2;y++)for(let x=wx;x<wx+3&&x<TW-2;x++)if(mapTiles[y][x]===0)mapTiles[y][x]=2;
  }
  // Theme decorations
  const themeDecos={school:[19,19,16,12,10],forest:[10,10,10,11,11,12,13],town:[18,18,18,16,11,12],stadium:[20,20,16,12,13]};
  const decoSet=themeDecos[mapTheme]||themeDecos.forest;
  for(let y=1;y<TH-1;y++)for(let x=1;x<TW-1;x++){
    if(mapTiles[y][x]!==0)continue;
    const r=rnd();
    if(r<0.11)mapTiles[y][x]=decoSet[Math.floor(rnd()*decoSet.length)];
    else if(r<0.15)mapTiles[y][x]=12;
    else if(r<0.165)mapTiles[y][x]=16;
    else if(r<0.175)mapTiles[y][x]=21;// lamp
  }
  for(let y=1;y<TH-1;y++)for(let x=1;x<TW-1;x++)if(mapTiles[y][x]===1&&rnd()<0.022)mapTiles[y][x]=15;
  // NPC spots
  const spots=[
    {x:(cx+1)*TILE+16,y:3*TILE+16},{x:3*TILE+16,y:(cy+1)*TILE+16},
    {x:(TW-4)*TILE+16,y:(cy+1)*TILE+16},{x:(cx+1)*TILE+16,y:(TH-4)*TILE+16},
    {x:(cx/2|0)*TILE+16,y:(cy/2|0)*TILE+16},
  ];
  npcDefs=[];
  const lv=QUESTIONS[selLv];
  const nCount=Math.min(wavePool.length,spots.length);
  for(let i=0;i<nCount;i++){
    const tx=Math.round(spots[i].x/TILE),ty=Math.round(spots[i].y/TILE);
    for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++){const nx=tx+dx,ny=ty+dy;if(nx>0&&nx<TW-1&&ny>0&&ny<TH-1)mapTiles[ny][nx]=1;}
    if(tx+2<TW-1)mapTiles[ty][tx+2]=14;
    npcDefs.push({id:i,x:spots[i].x,y:spots[i].y,name:lv.npcName,emoji:lv.npcEmoji,qIdx:i,color:lv.color,lvNum:selLv});
  }
  me.x=(cx+1)*TILE+16; me.y=(cy+1)*TILE+16;
}

function isSolid(wx,wy){
  const tx=wx/TILE|0,ty=wy/TILE|0;
  if(tx<0||ty<0||tx>=TW||ty>=TH)return true;
  const t=mapTiles[ty]?.[tx];
  return t===3||t===10||t===11||t===13||t===16||t===18||t===19||t===20;
}

// ══════ WAVE SYSTEM ══════
function initWave(wave){
  waveNum=wave; waveAnswered=0; waveCorrect=0; answeredNPCs.clear();
  SPR.clearCache();
  const lv=QUESTIONS[selLv],all=[...lv.questions];
  for(let i=all.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[all[i],all[j]]=[all[j],all[i]];}
  wavePool=all.slice(0,Math.min(QS_PER_WAVE,all.length));
  generateMap(selLv,wave);
  document.getElementById('hud-wave').textContent=`Wave ${wave}`;
  updateWBar();
  const badge=document.getElementById('map-badge');
  badge.textContent=MAP_THEMES[mapTheme].name; badge.style.opacity='1';
  clearTimeout(badge._t); badge._t=setTimeout(()=>badge.style.opacity='0',2500);
}

function updateWBar(){
  const n=Math.min(wavePool.length,npcDefs.length);
  const pct=n>0?(waveAnswered/n)*100:0;
  document.getElementById('wbar').style.width=pct+'%';
  document.getElementById('hud-prog').textContent=`${waveAnswered}/${n}`;
}

// ══════ RENDER ══════
const gc=document.getElementById('gc'),gctx=gc.getContext('2d');
const mmc=document.getElementById('mm'),mmx=mmc.getContext('2d');

function drawGroundTile(tx,ty,tile,px,py){
  const T=TILE;
  if(tile===1){
    const s=SPR.pathTile(mapTheme,tx,ty); gctx.drawImage(s,px,py);
  }else if(tile===2){
    const s=SPR.waterTile(animF,tx,ty); gctx.drawImage(s,px,py);
  }else if(tile===3){
    const s=SPR.wallTile(mapTheme,tx,ty); gctx.drawImage(s,px,py);
  }else{
    const s=SPR.groundTile(mapTheme,tx,ty); gctx.drawImage(s,px,py);
  }
}

function drawDecoTile(tx,ty,tile,px,py){
  const T=TILE; let sp=null;
  if(tile===10)sp=SPR.tree((tx*3+ty)%3);
  else if(tile===11)sp=SPR.bush((tx+ty*2)%3);
  else if(tile===12)sp=SPR.flower((tx*7+ty*3)%4);
  else if(tile===13)sp=SPR.rock((tx+ty)%3);
  else if(tile===14)sp=SPR.chest(false,animF);
  else if(tile===15)sp=SPR.star(animF);
  else if(tile===16)sp=SPR.fence();
  else if(tile===18)sp=SPR.house((tx*2+ty)%5);
  else if(tile===19)sp=SPR.schoolBuilding();
  else if(tile===20)sp=SPR.goalpost();
  else if(tile===21)sp=SPR.lamp();
  if(sp)gctx.drawImage(sp,px+(T-sp.width)/2,py+T-sp.height,sp.width,sp.height);
}

function renderNPC(npc){
  const px=npc.x-camX|0,py=npc.y-camY|0;
  if(px<-60||py<-60||px>gc.width+60||py>gc.height+60)return;
  const done=answeredNPCs.has(npc.id);
  const near=Math.hypot(me.x-npc.x,me.y-npc.y)<INTERACT*1.5;
  const sp=SPR.getNPC(npc.lvNum,animF);
  gctx.drawImage(sp,px-sp.width/2,py-sp.height+TILE/2);
  if(!done&&near){
    const b=Math.sin(animF*.12)*3|0;
    gctx.fillStyle='rgba(0,0,0,.65)'; gctx.fillRect(px-10,py-sp.height-10+b,20,18);
    gctx.font='bold 20px sans-serif'; gctx.textAlign='center';
    gctx.fillStyle='#ffd700'; gctx.fillText('!',px,py-sp.height+6+b);
  }else if(done){
    gctx.font='16px sans-serif'; gctx.textAlign='center'; gctx.fillStyle='#4caf50';
    gctx.fillText('✓',px,py-sp.height+4);
  }
  const nm=npc.emoji+' '+npc.name;
  const tw=gctx.measureText(nm).width+8;
  gctx.fillStyle='rgba(0,0,0,.75)'; gctx.fillRect(px-tw/2,py-sp.height-20,tw,14);
  gctx.fillStyle='#ffd700'; gctx.font='10px Sarabun,sans-serif'; gctx.textAlign='center';
  gctx.fillText(nm,px,py-sp.height-8);
}

function renderPlayer(p,isSelf){
  const px=p.x-camX|0,py=p.y-camY|0;
  if(px<-60||py<-60||px>gc.width+60||py>gc.height+60)return;
  const sp=SPR.getPlayer(p.avatar||0,p.direction||'down',animF,p.moving);
  gctx.drawImage(sp,px-sp.width/2,py-sp.height+TILE/2);
  if(isSelf){gctx.strokeStyle='rgba(93,222,58,.7)';gctx.lineWidth=2;gctx.beginPath();gctx.arc(px,py,13,0,Math.PI*2);gctx.stroke();}
  const nm=p.name||'?'; const tw=gctx.measureText(nm).width+7;
  gctx.fillStyle='rgba(0,0,0,.75)'; gctx.fillRect(px-tw/2,py-sp.height-8,tw,13);
  gctx.fillStyle=isSelf?'#5dde3a':'#fff'; gctx.font='10px Sarabun,sans-serif'; gctx.textAlign='center';
  gctx.fillText(nm,px,py-sp.height+3);
  const bub=bubbles[p.id||'self'];
  if(bub&&bub.timer>0){
    const bt=bub.text.slice(0,16),btw=gctx.measureText(bt).width+9;
    gctx.fillStyle='rgba(255,255,255,.92)'; gctx.fillRect(px-btw/2,py-sp.height-24,btw,14);
    gctx.fillStyle='#222'; gctx.fillText(bt,px,py-sp.height-12); bub.timer--;
  }
}

function renderMinimap(){
  mmx.fillStyle='rgba(0,0,0,.78)'; mmx.fillRect(0,0,112,80);
  const sw=112/TW,sh=80/TH;
  for(let y=0;y<TH;y++)for(let x=0;x<TW;x++){
    const t=mapTiles[y]?.[x];
    mmx.fillStyle=t===3?'#2a2a38':t>=10?'#1a3a0a':t===2?'#1565c0':t===1||t===15?'#7cad42':'#2d5a1b';
    mmx.fillRect(x*sw,y*sh,sw,sh);
  }
  npcDefs.forEach(n=>{mmx.fillStyle=answeredNPCs.has(n.id)?'#4caf50':'#ffd700';mmx.fillRect(n.x/TILE*sw-2,n.y/TILE*sh-2,4,4);});
  Object.values(players).forEach(p=>{mmx.fillStyle='#81d4fa';mmx.fillRect(p.x/TILE*sw-1,p.y/TILE*sh-1,3,3);});
  mmx.fillStyle='#5dde3a'; mmx.fillRect(me.x/TILE*sw-2,me.y/TILE*sh-2,5,5);
}

function render(){
  const W=window.innerWidth,H=window.innerHeight;
  gc.width=W; gc.height=H;
  camX=Math.max(0,Math.min(me.x-W/2,CW-W));
  camY=Math.max(0,Math.min(me.y-H/2,CH-H));
  const T=TILE;
  const tx0=Math.max(0,(camX/T|0)-1),ty0=Math.max(0,(camY/T|0)-1);
  const tx1=Math.min(TW,tx0+Math.ceil(W/T)+2),ty1=Math.min(TH,ty0+Math.ceil(H/T)+2);
  // Ground
  for(let ty=ty0;ty<ty1;ty++)for(let tx=tx0;tx<tx1;tx++){
    const tile=mapTiles[ty]?.[tx]||0;
    const px=tx*T-camX|0,py=ty*T-camY|0;
    if(tile<10)drawGroundTile(tx,ty,tile,px,py);
    else{gctx.drawImage(SPR.groundTile(mapTheme,tx,ty),px,py);}
  }
  // Decos sorted Y
  const decos=[];
  for(let ty=ty0;ty<ty1;ty++)for(let tx=tx0;tx<tx1;tx++)if((mapTiles[ty]?.[tx]||0)>=10)decos.push({tx,ty,t:mapTiles[ty][tx]});
  decos.sort((a,b)=>a.ty-b.ty);
  decos.forEach(d=>drawDecoTile(d.tx,d.ty,d.t,d.tx*T-camX|0,d.ty*T-camY|0));
  // NPCs
  npcDefs.forEach(n=>renderNPC(n));
  // Players
  const allP=[...Object.values(players),{...me,isSelf:true}];
  allP.sort((a,b)=>a.y-b.y);
  allP.forEach(p=>renderPlayer(p,p.isSelf||(p.id===me.id)));
  renderMinimap();
  // Update HUD avatar
  const hudAc=document.getElementById('hud-av-c');
  const hudAx=hudAc.getContext('2d'); hudAx.clearRect(0,0,24,36);
  hudAx.drawImage(SPR.getPlayer(selAv,me.direction||'down',animF,me.moving),0,0);
}

// ══════ GAME LOOP ══════
function loop(ts){
  const dt=Math.min((ts-lastT)/1000,.05); lastT=ts; animF++;
  update(dt); render();
  rafId=requestAnimationFrame(loop);
}

function update(dt){
  if(dialogOpen)return;
  const spd=128; let vx=0,vy=0;
  if(keys.ArrowLeft||keys.KeyA)vx=-1; if(keys.ArrowRight||keys.KeyD)vx=1;
  if(keys.ArrowUp||keys.KeyW)vy=-1; if(keys.ArrowDown||keys.KeyS)vy=1;
  if(vx&&vy){vx*=.707;vy*=.707;}
  const nx=me.x+vx*spd*dt,ny=me.y+vy*spd*dt,r=9;
  if(nx>r&&nx<CW-r&&!isSolid(nx-r,me.y)&&!isSolid(nx+r,me.y)&&!isSolid(nx-r,me.y+16)&&!isSolid(nx+r,me.y+16))me.x=nx;
  if(ny>r&&ny<CH-r&&!isSolid(me.x-r,ny)&&!isSolid(me.x+r,ny)&&!isSolid(me.x-r,ny+16)&&!isSolid(me.x+r,ny+16))me.y=ny;
  if(vx<0)me.direction='left'; else if(vx>0)me.direction='right'; else if(vy<0)me.direction='up'; else if(vy>0)me.direction='down';
  me.moving=vx!==0||vy!==0;
  if(Date.now()-lastSent>MOVE_MS){wsSend('MOVE',{x:me.x,y:me.y,direction:me.direction,moving:me.moving});lastSent=Date.now();}
  for(const n of npcDefs){
    if(answeredNPCs.has(n.id)||dialogOpen)continue;
    if(Math.hypot(me.x-n.x,me.y-n.y)<INTERACT&&(keys.Space||keys.KeyE)){keys.Space=false;keys.KeyE=false;openDialog(n);break;}
  }
  if(animF%300===0){pingT=Date.now();wsSend('PING',{});}
}

// ══════ DIALOG/QUIZ ══════
function openDialog(npc){
  dialogOpen=true;
  const q=wavePool[npc.qIdx]; if(!q)return;
  document.getElementById('dlg-npc').innerHTML=`${npc.emoji} ${npc.name}`;
  document.getElementById('dlg-sub').textContent=`Wave ${waveNum} · คำถามที่ ${npc.qIdx+1}/${Math.min(wavePool.length,npcDefs.length)}`;
  document.getElementById('quiz-area').style.display='block';
  document.getElementById('quiz-q').textContent='❓ '+q.q;
  document.getElementById('quiz-exp').style.display='none';
  document.getElementById('quiz-pop').style.display='none';
  document.getElementById('dlg-close').style.display='none';
  const opts=document.getElementById('qopts'); opts.innerHTML='';
  q.opts.forEach((o,i)=>{
    const b=document.createElement('button'); b.className='ob';
    b.textContent=['ก','ข','ค','ง'][i]+') '+o;
    b.onclick=()=>selectAns(npc,q,i,b);
    opts.appendChild(b);
  });
  document.getElementById('dialog').classList.add('show');
}

function selectAns(npc,q,idx,btn){
  document.querySelectorAll('.ob').forEach(b=>b.disabled=true);
  const ok=idx===q.ans;
  btn.className='ob '+(ok?'ok':'no');
  if(!ok)document.querySelectorAll('.ob')[q.ans].className='ob show-ans';
  document.getElementById('quiz-exp').textContent='💡 '+q.explain;
  document.getElementById('quiz-exp').style.display='block';
  const pop=document.getElementById('quiz-pop');
  if(ok){pop.textContent='🌟 +100 คะแนน!';pop.className='pop-ok';wsSend('SCORE',{delta:100,wave:waveNum});waveCorrect++;}
  else{pop.textContent='❌ ไม่ถูก — ดูคำตอบที่ถูกต้องด้านบน';pop.className='pop-no';}
  pop.style.display='block';
  answeredNPCs.add(npc.id); waveAnswered++; updateWBar();
  document.getElementById('dlg-close').style.display='block';
  checkWaveClear();
}

function closeDialog(){dialogOpen=false;document.getElementById('dialog').classList.remove('show');}

function checkWaveClear(){
  const n=Math.min(wavePool.length,npcDefs.length);
  if(waveAnswered<n)return;
  setTimeout(()=>{
    closeDialog();
    document.getElementById('wc-icon').textContent=waveCorrect>=n?'🏆':'🎉';
    document.getElementById('wc-title').textContent=`Wave ${waveNum} สำเร็จ!`;
    document.getElementById('wc-sub').textContent=`${MAP_THEMES[mapTheme].name} · ถูก ${waveCorrect}/${n} ข้อ`;
    document.getElementById('wc-score').textContent=`⭐ ${myScore} คะแนน`;
    document.getElementById('wc-next').onclick=()=>{
      document.getElementById('wave-clear').classList.remove('show');
      wsSend('WAVE_CLEAR',{wave:waveNum});
      initWave(waveNum+1);
    };
    document.getElementById('wc-end').onclick=()=>{
      document.getElementById('wave-clear').classList.remove('show');
      wsSend('GAME_END',{});
      doShowResults(buildLocalLB());
    };
    document.getElementById('wave-clear').classList.add('show');
  },550);
}

// ══════ RESULTS ══════
function buildLocalLB(){
  const all=[{id:me.id||selfId,name:me.name,score:myScore,avatar:selAv,wave:waveNum},...Object.values(players)];
  return all.sort((a,b)=>b.score-a.score).map((p,i)=>({...p,rank:i+1}));
}

function doShowResults(lb){
  if(rafId){cancelAnimationFrame(rafId);rafId=null;}
  document.getElementById('s-game').classList.add('off');
  document.getElementById('s-results').classList.remove('off');
  const tbody=document.getElementById('res-tbody'); tbody.innerHTML='';
  const medals=['🥇','🥈','🥉'];
  lb.forEach((p,i)=>{
    const isSelf=p.id===selfId;
    const tr=document.createElement('tr'); if(isSelf)tr.className='res-self';
    const rc=i<3?`rank-${i+1}`:'';
    // Avatar cell with pixel art
    const avC=document.createElement('canvas'); avC.width=24; avC.height=36;
    avC.getContext('2d').drawImage(SPR.getPlayer(p.avatar||0,'down',0,false),0,0);
    const avWrap=document.createElement('div'); avWrap.className='res-av'; avWrap.appendChild(avC);
    tr.innerHTML=`<td class="${rc}">${medals[i]||i+1}</td><td></td><td class="${rc}">${p.name}${isSelf?' 👈':''}</td><td style="text-align:right" class="${rc}">${(p.score||0).toLocaleString()}</td><td style="text-align:right;color:var(--muted)">W${p.wave||waveNum}</td>`;
    tr.cells[1].appendChild(avWrap);
    tbody.appendChild(tr);
  });
  const w=lb[0];
  document.getElementById('res-sub').textContent=w?`🏆 ผู้ชนะ: ${w.name} · ${(w.score||0).toLocaleString()} คะแนน · ${waveNum} Wave`:'';
}

function goLobby(){
  document.getElementById('s-results').classList.add('off');
  document.getElementById('s-lobby').classList.remove('off');
  myScore=0;waveNum=1;players={};answeredNPCs.clear();
  document.getElementById('hud-sc').textContent='0';
}

// ══════ UI HELPERS ══════
function updateLB(lb){
  const list=document.getElementById('lb-list'); list.innerHTML='';
  (lb||[]).slice(0,8).forEach((p,i)=>{
    const li=document.createElement('li');
    const rc=i===0?'g':i===1?'s':i===2?'b':'';
    li.innerHTML=`<span class="lbr ${rc}">${i+1}</span><span class="lbn ${p.id===selfId?'lb-me':''}">${p.name}</span><span class="lbs">${p.score}</span>`;
    list.appendChild(li);
  });
}
function updatePCount(){document.getElementById('hud-pl').textContent='👥 '+(Object.keys(players).length+1);}
function addChat(text,type='user',name='',self=false){
  const log=document.getElementById('chat-log');
  const d=document.createElement('div'); d.className='cm'+(type==='sys'?' sys':'');
  d.innerHTML=type==='sys'?text:`<span class="cn">${self?'คุณ':name}:</span> ${text}`;
  log.appendChild(d); log.scrollTop=log.scrollHeight;
  if(log.children.length>40)log.removeChild(log.firstChild);
}
function showBubble(id,text){bubbles[id]={text,timer:180};}
function sendReady(){wsSend('READY',{});document.getElementById('btn-ready').textContent='✅ พร้อมแล้ว!';document.getElementById('btn-ready').disabled=true;}

// ══════ INPUT ══════
document.addEventListener('keydown',e=>{
  keys[e.code]=true;
  if(e.code==='Enter'){const ci=document.getElementById('ci');if(document.activeElement===ci)sendChat();else ci.focus();e.preventDefault();}
  if(e.code==='Escape')closeDialog();
  if((e.code==='Space'||e.code==='KeyE')&&dialogOpen)e.preventDefault();
});
document.addEventListener('keyup',e=>{keys[e.code]=false;});
function sendChat(){
  const ci=document.getElementById('ci'),t=ci.value.trim(); if(!t)return;
  ci.value=''; wsSend('CHAT',{text:t}); addChat(t,'user','',true);
  if(me.id)showBubble(me.id,t); ci.blur();
}
document.getElementById('cs').onclick=sendChat;
document.getElementById('ci').addEventListener('keydown',e=>{if(e.key==='Enter'){sendChat();e.preventDefault();}e.stopPropagation();});
let jOn=false,jO={x:0,y:0};
document.getElementById('joy-base').addEventListener('touchstart',e=>{jOn=true;const t=e.touches[0];jO={x:t.clientX,y:t.clientY};e.preventDefault();},{passive:false});
document.addEventListener('touchmove',e=>{
  if(!jOn)return;
  const t=e.touches[0],dx=t.clientX-jO.x,dy=t.clientY-jO.y,len=Math.hypot(dx,dy)||1,max=30;
  const cx=dx/len*Math.min(len,max),cy=dy/len*Math.min(len,max);
  document.getElementById('joy-knob').style.transform=`translate(calc(-50% + ${cx}px),calc(-50% + ${cy}px))`;
  keys.ArrowLeft=cx<-8;keys.ArrowRight=cx>8;keys.ArrowUp=cy<-8;keys.ArrowDown=cy>8;
  e.preventDefault();
},{passive:false});
document.addEventListener('touchend',()=>{jOn=false;document.getElementById('joy-knob').style.transform='translate(-50%,-50%)';['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].forEach(k=>keys[k]=false);});

// ══════ START ══════
function joinRoom(){
  const name=document.getElementById('inp-name').value.trim()||'นักเรียน';
  const room=document.getElementById('inp-room').value.trim()||'default';
  me.name=name; me.avatar=selAv;
  if(ws&&ws.readyState===1)wsSend('JOIN',{name,avatar:selAv,roomId:room});
  else{selfId='local-'+Date.now();me.id=selfId;startGame(1);}
}

function startGame(wave){
  if(!me.id)me.id=selfId||('local-'+Date.now());
  initWave(wave||1);
  const lv=QUESTIONS[selLv];
  document.getElementById('hud-name').textContent=me.name;
  document.getElementById('hud-lv').textContent=lv.npcEmoji+' '+lv.name.split(' ')[0];
  document.getElementById('hud-sc').textContent='0';
  document.getElementById('s-lobby').classList.add('off');
  document.getElementById('s-game').classList.remove('off');
  addChat(`🎮 Wave 1 เริ่ม! ธีม: ${MAP_THEMES[mapTheme].name}`,'sys');
  if(rafId)cancelAnimationFrame(rafId);
  lastT=0; rafId=requestAnimationFrame(t=>{lastT=t;loop(t);});
}

window.addEventListener('load',()=>{buildLobby();connectWS();});
window.addEventListener('resize',()=>{if(!document.getElementById('s-game').classList.contains('off')){gc.width=window.innerWidth;gc.height=window.innerHeight;}});
</script>
